<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NR Lifestyle Store</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17202a;--mute:#5d6b78;--line:#dde3e0;--accent:#0f766e;--sale:#e11d48}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161a;--card:#182026;--ink:#eef2f3;--mute:#93a1ab;--line:#26323a;--accent:#2dd4bf;--sale:#fb7185}}
:root[data-theme=dark]{--bg:#10161a;--card:#182026;--ink:#eef2f3;--mute:#93a1ab;--line:#26323a;--accent:#2dd4bf;--sale:#fb7185}
*{box-sizing:border-box;margin:0}
html{padding-top:env(safe-area-inset-top,0)}
body{font-family:'Hind Siliguri','Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0);z-index:5}
.logo{font-weight:700;font-size:19px}
.hbtn{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.ib{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.hero{padding:34px 16px 26px;max-width:1000px;margin:auto}
.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.25;max-width:14em}
.hero p{color:var(--mute);margin-top:8px}
.wrap{max-width:1000px;margin:auto;padding:0 16px 40px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .im{position:relative}
.card img{width:100%;height:210px;object-fit:cover;display:block;background:var(--line)}
.tag{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;font-size:12px;padding:2px 9px;border-radius:6px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.cat{font-size:13px;color:var(--mute)}
.nm{font-weight:600}
.pr{font-weight:700;color:var(--accent);font-size:18px}
.add{margin-top:auto;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.add:disabled{background:var(--line);color:var(--mute)}
.empty{color:var(--mute);padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:flex-end;z-index:20}
.ov.show{display:flex}
.panel{background:var(--card);width:min(420px,100%);height:100%;overflow-y:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0));padding-bottom:calc(18px + env(safe-area-inset-bottom,0))}
.panel h3{margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.qty span{display:inline-block;min-width:24px;text-align:center}
.panel input{width:100%;padding:11px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.total{font-weight:700;font-size:18px;margin:14px 0 4px;display:flex;justify-content:space-between}
.send{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.close{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="logo">NR Lifestyle Store</div>
  <div class="hbtn">
    <button class="ib" id="theme" aria-label="থিম বদলান">🌙</button>
    <button class="ib" id="cartBtn">🛒 <span id="cnt">0</span></button>
  </div>
</header>

<section class="hero">
  <h1>আপনার পছন্দের সব পণ্য এক জায়গায়</h1>
  <p>Fashion, Lifestyle, ছেলে, মেয়ে ও শিশুদের কালেকশন</p>
</section>

<main class="wrap">
  <input class="search" id="q" placeholder="পণ্যের নাম বা ক্যাটাগরি খুঁজুন">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="ov" id="ov">
  <div class="panel">
    <h3>আপনার কার্ট</h3>
    <div id="items"></div>
    <div class="total"><span>মোট</span><span id="sum">৳0</span></div>
    <div id="form">
      <input id="cn" placeholder="আপনার নাম">
      <input id="cp" placeholder="মোবাইল নম্বর" inputmode="tel">
      <input id="ca" placeholder="পূর্ণ ঠিকানা (এলাকা, জেলা)">
      <button class="send" id="send">WhatsApp-এ অর্ডার পাঠান</button>
    </div>
    <button class="close" id="close">কেনাকাটা চালিয়ে যান</button>
  </div>
</div>

<script>
// ===== এখানে নিজের WhatsApp নম্বর দিন (দেশের কোডসহ, + ছাড়া) =====
const WHATSAPP = "8801795297835";
// =================================================================

const FALLBACK=[{id:1,name:"Premium T-Shirt",category:"ছেলে",price:550,stock:50,offer:true,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"}];
let products=[],cat="সব",cart={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bn=n=>"৳"+Number(n).toLocaleString("en-US");

try{cart=JSON.parse(localStorage.getItem("nr_cart")||"{}")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("nr_cart",JSON.stringify(cart))}catch(e){}};

fetch("products.json?t="+Date.now()).then(r=>r.ok?r.json():Promise.reject()).catch(()=>FALLBACK).then(d=>{products=d;draw();drawCart()});

function draw(){
  const cats=["সব",...new Set(products.map(p=>p.category))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  const list=products.filter(p=>(cat==="সব"||p.category===cat)&&(p.name+p.category).toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(p=>`
    <div class="card"><div class="im"><img loading="lazy" src="${esc(p.img||"")}" alt="${esc(p.name)}">${p.offer?'<span class="tag">Offer</span>':""}</div>
    <div class="info"><div class="cat">${esc(p.category)}</div><div class="nm">${esc(p.name)}</div><div class="pr">${bn(p.price)}</div>
    <button class="add" data-id="${p.id}" ${p.stock<1?"disabled":""}>${p.stock<1?"স্টক শেষ":"কার্টে যোগ করুন"}</button></div></div>`).join(""):'<p class="empty">কোনো পণ্য পাওয়া যায়নি।</p>';
}
function drawCart(){
  const ids=Object.keys(cart).filter(id=>products.find(p=>p.id==id));
  let sum=0,n=0;
  $("items").innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id==id),q=cart[id];sum+=p.price*q;n+=q;
    return `<div class="row"><div><div class="nm">${esc(p.name)}</div><div class="cat">${bn(p.price)}</div></div>
    <div class="qty"><button data-d="-1" data-id="${id}">−</button><span>${q}</span><button data-d="1" data-id="${id}">+</button></div></div>`}).join(""):'<p class="empty">কার্ট খালি। পণ্য যোগ করুন।</p>';
  $("sum").textContent=bn(sum);$("cnt").textContent=n;
  $("form").style.display=ids.length?"block":"none";
}
const change=(id,d)=>{const p=products.find(x=>x.id==id);const q=(cart[id]||0)+d;
  if(q<=0)delete cart[id];else cart[id]=Math.min(q,p.stock);saveCart();drawCart()};

$("grid").onclick=e=>{const b=e.target.closest(".add");if(b){change(b.dataset.id,1);$("cartBtn").animate([{transform:"scale(1.15)"},{transform:"scale(1)"}],200)}};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;draw()}};
$("q").oninput=draw;
$("items").onclick=e=>{const b=e.target.closest("button");if(b)change(b.dataset.id,+b.dataset.d)};
$("cartBtn").onclick=()=>$("ov").classList.add("show");
$("close").onclick=()=>$("ov").classList.remove("show");
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("show")};
$("theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#10161a";r.dataset.theme=d?"light":"dark";$("theme").textContent=d?"🌙":"☀️"};

$("send").onclick=()=>{
  const name=$("cn").value.trim(),phone=$("cp").value.trim(),addr=$("ca").value.trim();
  if(!name||!phone||!addr){alert("নাম, মোবাইল নম্বর ও ঠিকানা দিন।");return}
  if(WHATSAPP.includes("X")){alert("দোকানের WhatsApp নম্বর এখনো সেট করা হয়নি।");return}
  let sum=0;
  const lines=Object.keys(cart).map(id=>{const p=products.find(x=>x.id==id);if(!p)return"";sum+=p.price*cart[id];return `• ${p.name} × ${cart[id]} = ${bn(p.price*cart[id])}`}).filter(Boolean);
  const msg=`নতুন অর্ডার\n${lines.join("\n")}\nমোট: ${bn(sum)}\n\nনাম: ${name}\nমোবাইল: ${phone}\nঠিকানা: ${addr}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  cart={};saveCart();drawCart();$("ov").classList.remove("show");
};
</script>
</body>
</html>
